name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # PostgreSQL éphémère démarré ci-dessous (étape "Démarrer PostgreSQL"),
      # vierge à chaque run : plus de dépendance à une base distante
      # persistante qui pouvait dériver du schéma réellement testé (cause de
      # l'échec du run précédent : migrations 030-034 absentes côté distant).
      DATABASE_URL: postgresql://shalom_ci:shalom_ci_pw@localhost:5432/shalom_ci
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      JWT_REFRESH_SECRET: ${{ secrets.JWT_REFRESH_SECRET }}
      FEDAPAY_WEBHOOK_SECRET: ${{ secrets.FEDAPAY_WEBHOOK_SECRET }}
      ADMIN_EMAILS: ${{ secrets.ADMIN_EMAILS }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # src/config/db.js exige toujours ssl:{rejectUnauthorized:false} (code
      # applicatif, non modifié ici) : l'image postgres officielle n'active
      # pas SSL par défaut, donc on le configure nous-mêmes avant que
      # l'application ne s'y connecte. Mêmes étapes que la reproduction
      # locale ayant confirmé le diagnostic.
      - name: Démarrer PostgreSQL éphémère
        run: |
          docker run -d --name ci-postgres \
            -e POSTGRES_USER=shalom_ci \
            -e POSTGRES_PASSWORD=shalom_ci_pw \
            -e POSTGRES_DB=shalom_ci \
            -p 5432:5432 \
            postgres:16-alpine

          echo "Attente de PostgreSQL (pg_isready)..."
          for i in $(seq 1 30); do
            if docker exec ci-postgres pg_isready -U shalom_ci -d shalom_ci; then
              break
            fi
            if [ "$i" -eq 30 ]; then
              echo "PostgreSQL non prêt après 60s" >&2
              exit 1
            fi
            sleep 2
          done

      - name: Activer SSL sur PostgreSQL (requis par src/config/db.js)
        run: |
          docker exec -u root ci-postgres sh -c "apk add --no-cache openssl >/dev/null"
          docker exec -u root ci-postgres sh -c "
            cd /var/lib/postgresql/data &&
            openssl req -new -x509 -days 365 -nodes -text \
              -out server.crt -keyout server.key -subj '/CN=localhost' &&
            chown postgres:postgres server.crt server.key &&
            chmod 600 server.key
          "
          docker exec -u postgres ci-postgres psql -U shalom_ci -d shalom_ci -c "ALTER SYSTEM SET ssl = on;"
          docker restart ci-postgres

          echo "Attente de PostgreSQL après redémarrage SSL..."
          for i in $(seq 1 30); do
            if docker exec ci-postgres pg_isready -U shalom_ci -d shalom_ci; then
              break
            fi
            if [ "$i" -eq 30 ]; then
              echo "PostgreSQL non prêt après redémarrage SSL" >&2
              exit 1
            fi
            sleep 2
          done

      - name: Installer les dépendances
        run: npm ci

      - name: Appliquer les migrations (000 -> 034)
        run: npm run migrate

      - name: Vérifier la présence des objets des migrations récentes
        run: |
          docker exec ci-postgres psql -U shalom_ci -d shalom_ci -v ON_ERROR_STOP=1 -c "
            DO \$\$
            BEGIN
              IF to_regclass('public.uploads') IS NULL THEN
                RAISE EXCEPTION 'migration 030 absente : table uploads introuvable';
              END IF;
              IF to_regclass('public.referrals') IS NULL THEN
                RAISE EXCEPTION 'migration 031 absente : table referrals introuvable';
              END IF;
              IF NOT EXISTS (
                SELECT 1 FROM information_schema.columns
                WHERE table_name = 'subscriptions' AND column_name = 'payment_reference'
              ) THEN
                RAISE EXCEPTION 'migration 032 absente : colonne subscriptions.payment_reference introuvable';
              END IF;
              IF to_regclass('public.wallet_topup_requests') IS NULL THEN
                RAISE EXCEPTION 'migration 034 absente : table wallet_topup_requests introuvable';
              END IF;
              RAISE NOTICE 'Migrations 030-034 confirmées présentes.';
            END
            \$\$;
          "

      - name: Lancer la suite de tests
        run: npm test

      - name: Audit de sécurité npm
        run: npm audit
